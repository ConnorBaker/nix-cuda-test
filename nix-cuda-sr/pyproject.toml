[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "nix_cuda_sr"
version = "0.1.0"
authors = [{ name = "Connor Baker", email = "connorbaker01@gmail.com" }]
description = "Test project for Nix CUDA support"
requires-python = ">=3.12"
keywords = ["nix", "machine", "learning", "torch", "gpu", "test", "cuda"]
license = { text = "BSD-3-Clause" }
dependencies = [
    "cutlass",
    "flash-attn",
    "pydantic",
    "pytorch-lightning",
    "rawpy",
    "einops",
    "pillow",
    "optuna",
    "schedulefree",
    "onnx",
    "tensorrt",
    "modelopt[torch]",
    "tensorboard-plugin-profile",
    "torch", # torch comes with PyTorch's triton build
    "torch-tb-profiler",
    "torchmetrics",
    "torchvision",
    "transformer-engine",
]

[project.optional-dependencies]
dev = ["ruff>=0.3.0"]

[project.scripts]
nix-cuda-test = "nix_cuda_sr.__main__:main"

[tool.ruff]
line-length = 120

[tool.ruff.format]
preview = true

[tool.ruff.lint]
preview = true
select = ["F", "E", "W", "I", "PL", "FURB", "LOG", "RUF", "G", "TID"]
ignore = [
  # Ignore functions with many arguments (I like currying)
  "PLR0913",
]

[tool.pyright]
include = ["./nix_cuda_sr"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
